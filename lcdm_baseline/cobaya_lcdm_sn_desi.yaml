# Cobaya input: fluid ΛCDM (w0=-1, wa=0 fixed) + Pantheon+SH0ES + DESI DR2.
# Stock CLASS (no GA CLASS rebuild). Same datasets as the GA sn_desi setup.

theory:
  classy:
    extra_args:
      N_ncdm: 1
      N_ur: 2.0328
      non_linear: none
      fluid_equation_of_state: CLP

likelihood:
  sn.pantheonplusshoes: null
  bao.desi_dr2: null

params:
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.05, scale: 0.001}
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.002
    latex: n_\mathrm{s}
  H0:
    prior: {min: 20, max: 100}
    ref: {dist: norm, loc: 67, scale: 2}
    proposal: 2
    latex: H_0
  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.055, scale: 0.006}
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.0224, scale: 0.0001}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.12, scale: 0.001}
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  m_ncdm:
    value: 0.06
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  Omega_m:
    latex: \Omega_\mathrm{m}
  YHe:
    latex: Y_\mathrm{P}
  z_reio:
    latex: z_\mathrm{re}
  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  # ΛCDM via fluid: w ≡ -1, not sampled
  Omega_Lambda: 0
  w0_fld: -1.0
  wa_fld: 0.0

sampler:
  mcmc:
    Rminus1_stop: 0.05
    max_samples: 50
    output_every: 30s
