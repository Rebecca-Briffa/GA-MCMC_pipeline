# SN + BAO Cobaya config for the GA (background-only fits).
# Select with: COBAYA_CONFIG = "sn_desi"  in GA_MCMC_new.py
# or: export GA_COBAYA_CONFIG=sn_desi
#
# SN: Pantheon+SH0ES (sn.pantheonplusshoes) — includes Cepheid calibration / H0 anchor.
# BAO: DESI DR2.

theory:
  classy:
    extra_args:
      N_ncdm: 1
      N_ur: 2.0328
      non_linear: none

likelihood:
  sn.pantheonplusshoes: null
  bao.desi_dr2: null

params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 20
      max: 100
    ref:
      dist: norm
      loc: 67
      scale: 2
    proposal: 2
    latex: H_0
  tau_reio:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  m_ncdm:
    value: 0.06
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  Omega_m:
    latex: \Omega_\mathrm{m}
  YHe:
    latex: Y_\mathrm{P}
  z_reio:
    latex: z_\mathrm{re}
  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2

sampler:
  mcmc:
    Rminus1_cl_stop: 0.2
    Rminus1_stop: 20.0
    covmat: auto
    max_samples: 200
    proposal_scale: 1.4
    output_every: 30s
